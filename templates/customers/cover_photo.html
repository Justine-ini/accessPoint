{% load static %}
{% if user_profile.cover_photo %}
  <div class="page-section restaurant-detail-image-section"
       style="background: url('{{ user_profile.cover_photo.url }}') no-repeat scroll 0 0 / cover;">
{% else %}
  <div class="page-section restaurant-detail-image-section"
       style="background: url('{% static "images/default-cover.PNG" %}') no-repeat scroll 0 0 / cover;">
{% endif %}
    <!-- Container Start -->
    <div class="container">
        <!-- Row Start -->
        <div class="row">
            <!-- Column Start -->
            <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <div class="company-info-detail">
                    <div class="company-info">
                        <div class="img-holder">
                            <figure>
                                {% if user_profile.profile_picture %}
                                  <img src="{{ user_profile.profile_picture.url }}" alt="">
                                {% else %}
                                  <img src="{% static 'images/default-profile.PNG' %}" alt="">
                                {% endif %}
                            </figure>
                        </div>

                        <div class="text-holder customer-banner-info">
                            <span class="restaurant-title">{{ user.first_name }} {{ user.last_name }}</span>
                            <div class="customer-contact-list">
                                <div class="text customer-contact-row">
                                    <i class="icon-mail"></i>
                                    <p><a href="mailto:{{ user.email }}">{{ user.email }}</a></p>
                                </div>
                                {% if user.phone_number %}
                                    <div class="text customer-contact-row">
                                        <i class="icon-phone"></i>
                                        <p><a href="tel:{{ user.phone_number }}">{{ user.phone_number }}</a></p>
                                    </div>
                                {% endif %}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Column End -->
        </div>
        <!-- Row End -->
    </div>
    <!-- Container End -->
</div>
